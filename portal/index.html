<body>

<header><a class="wordmark" href="./" aria-label="Game Companion 首頁"><svg aria-hidden="true" viewBox="0 0 32 32" width="28" height="28"><path d="M11 5H5v22h6M21 5h6v22h-6M11 16h10M16 11v10" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>Game Companion</a><span>遊戲工具箱</span></header>
<main>
<div class="intro"><div><h1>下一站，玩哪一款？</h1><p>收集漏掉的那一件，或從你正在玩的章節接著走。</p></div><a class="intro-link" href="#games">打開遊戲手帳 <span aria-hidden="true">↘</span></a></div>
<section id="games" aria-labelledby="gamesTitle"><div class="section-heading"><h2 id="gamesTitle">你的遊戲工具箱</h2><span id="visible-count"><!--GAME_COUNT--> 款遊戲</span></div><div class="catalogue-tools"><div class="catalogue-filters" aria-label="遊戲工具類型"><button data-kind="all" aria-pressed="true">全部遊戲</button><button data-kind="checklist" aria-pressed="false">收集與配裝</button><button data-kind="roadmap" aria-pressed="false">白金 Roadmap</button></div><label class="catalogue-search">找遊戲<input id="game-search" type="search" placeholder="遊戲名稱或功能…"></label></div><div class="game-list"><!--GAME_LIST--></div><p id="no-games" hidden>沒有符合的遊戲，換個關鍵字或選「全部遊戲」試試。</p></section>
<div class="notes"><section><h2>把舊進度帶過來</h2><p>先在舊站下載 JSON 備份，再進入對應手帳的「備份與還原」。檢查差異、保存備份後，即可匯入。</p></section><section><h2>每款遊戲，獨立保存</h2><p>進度留在目前瀏覽器，記得定期下載備份。Google Drive 由各款手帳獨立管理，通過連接驗證後可手動同步。</p></section></div>
</main>
