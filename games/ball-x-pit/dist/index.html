<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALL x PIT · Game Companion</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><a class="skip" href="#app">跳到內容</a>
<aside class="rail"><a href="../../" class="portal">← Game Companion</a><div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 25 17 32 31 25M3 18 17 25 31 18M3 11 17 18 31 11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="6" r="4" fill="currentColor"/></svg><strong>BALL x PIT</strong></div><p class="muted scope">PS5 · 本體＋三次免費更新</p><button id="nav-toggle" aria-expanded="false" aria-controls="nav">功能選單</button><nav id="nav" aria-label="主要功能"></nav><p class="rail-foot">白金優先，逐層清理。<br>本機進度 · 手動 JSON 備份</p></aside>
<div class="workspace"><header><span id="save-state" role="status">載入攻略與進度…</span><button id="open-backup">備份與還原</button></header><div id="message" role="status" aria-live="polite"></div><main id="app" tabindex="-1"><h1>BALL x PIT</h1><p>正在載入八層攻略…</p></main><footer>資料版本 <span id="data-version">載入中</span> · 來源與實機限制見「來源與覆蓋」。網站 JSON 不是 PS5 遊戲存檔。</footer></div>
<dialog id="backup-dialog" aria-labelledby="backup-title"><div class="dialog-head"><h2 id="backup-title">備份與還原</h2><button data-close aria-label="關閉備份">關閉</button></div><p>完整備份包含目前進度、快照與匯入兩端原文。請定期另存 JSON。</p><button id="export">下載完整 JSON</button><hr><label>復原檔使用哪一端<select id="recovery-side"><option value="localRaw">匯入前本機</option><option value="sourceRaw">當時匯入來源</option></select></label><label class="file">選擇 BALL x PIT JSON（上限 5 MiB）<input type="file" id="import-file" accept=".json,application/json"></label><p id="backup-status" role="status"></p><p class="muted">先保存原文、比較差異，再下載兩端備份並確認後套用。損壞或不相容版本不會覆寫。</p></dialog>
<dialog id="import-dialog" aria-labelledby="import-title"><div class="dialog-head"><h2 id="import-title">匯入差異預覽</h2><button data-close>取消</button></div><p id="import-summary"></p><div class="toolbar"><button id="import-local">全部保留本機</button><button id="import-source">全部使用匯入</button></div><div id="import-rows"></div><p id="import-status" role="status"></p><button id="import-download">下載兩端復原備份</button><label class="check"><input type="checkbox" id="import-ack" disabled>我已確認備份檔已保存，並同意套用選擇</label><button id="import-apply" disabled>套用匯入</button></dialog>
</body></html>
