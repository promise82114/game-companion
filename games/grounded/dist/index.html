<header class="workspace-bar"><span>Grounded / 庭院手帳</span><button id="open-backup">備份與還原</button></header>
<main id="app"><p role="status">正在讀取本機進度…</p></main><noscript>此手帳需要 JavaScript 才能保存進度。</noscript>
<p id="feedback" role="status" aria-live="polite"></p>
<dialog id="backup-dialog" aria-labelledby="backup-title"><div class="dialog-heading"><h2 id="backup-title">備份與還原</h2><button data-close>關閉</button></div><p>包含所有世界、周目、成員及未知欄位；網站備份不是遊戲存檔。</p><div class="actions"><button id="export-progress">匯出進度 JSON</button><button id="export-recovery">匯出完整復原備份</button></div><label>選擇要比較的 JSON<input id="import-file" type="file" accept=".json,application/json"></label><p>Drive 尚未接入此多世界 schema；沒有即時多人同步。</p></dialog>
<dialog id="import-dialog" aria-labelledby="import-title"><div class="dialog-heading"><h2 id="import-title">匯入差異預覽</h2><button data-close>取消</button></div><p>兩端原文已保存。每筆差異請選擇；來源新增的未知資料亦保留。</p><div class="actions"><button id="import-local">差異全部用本機</button><button id="import-source">差異全部用來源</button></div><div id="import-rows"></div><button id="import-download">下載兩端原文復原包</button><label><input id="import-ack" type="checkbox" disabled>我已開啟並確認下載檔案可讀、已保存</label><p id="import-status" role="status"></p><button id="import-apply" disabled>確認套用</button></dialog>
<script src="../../shared/merge-core.js"></script><script type="module" src="app.js"></script></body></html>
